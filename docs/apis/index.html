<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriginBI Mobile App — Developer API Portal (AES-256 Encrypted)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: #111827;
      --bg-card: #162032;
      --border-color: #24344d;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #38bdf8;
      --accent-secondary: #818cf8;
      --code-bg: #070d18;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
    }

    /* Auth Gatekeeper Overlay */
    .auth-gatekeeper-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 29, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .auth-gatekeeper-overlay.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-gatekeeper-card {
      background: linear-gradient(145deg, #162032, #0d1424);
      border: 1px solid #2a3c5a;
      border-radius: 20px;
      padding: 42px 38px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.15);
      animation: cardPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardPop {
      0% { opacity: 0; transform: scale(0.92) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .auth-lock-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .auth-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 14px;
    }

    .auth-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .auth-input-group {
      position: relative;
      margin-bottom: 14px;
    }

    .auth-input {
      width: 100%;
      background: #070d18;
      border: 1px solid #2b3d5b;
      border-radius: 10px;
      padding: 13px 44px 13px 16px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .auth-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .btn-toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-toggle-pass:hover { color: #fff; }

    .auth-error-msg {
      display: none;
      color: #fb7185;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .auth-error-msg.show {
      display: block;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-unlock {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    .btn-unlock:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
    }

    .auth-footer-note {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 20px;
    }

    /* Dynamic Container for Decrypted Content */
    #decryptedPortalHost {
      width: 100%;
      display: flex;
      min-height: 100vh;
    }

    /* Injected Portal Styles */
    .sidebar { width: 360px; background-color: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; overflow-y: auto; }
    .sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(--border-color); background: linear-gradient(180deg, rgba(22, 32, 50, 1) 0%, rgba(10, 15, 29, 0.4) 100%); }
    .brand-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; color: #fff; }
    .brand-title .logo-dot { width: 12px; height: 12px; background: linear-gradient(135deg, #38bdf8, #818cf8); border-radius: 50%; box-shadow: 0 0 12px rgba(56, 189, 248, 0.8); }
    .brand-badge { font-size: 0.7rem; background: linear-gradient(135deg, #0284c7, #6366f1); color: #fff; padding: 3px 8px; border-radius: 9999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .brand-sub { font-size: 0.82rem; color: var(--text-secondary); margin-top: 6px; }
    .search-box { padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
    .search-input { width: 100%; background: var(--code-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 0.85rem; font-family: inherit; outline: none; transition: all 0.2s; }
    .search-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    .downloads-container { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .btn-download { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--code-bg); border: 1px solid var(--border-color); color: var(--accent-primary); padding: 9px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-download:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent-primary); transform: translateY(-1px); }
    .btn-download.btn-postman { color: #fb923c; border-color: rgba(251, 146, 60, 0.3); }
    .btn-download.btn-postman:hover { background: rgba(251, 146, 60, 0.1); border-color: #fb923c; }
    .btn-lock-session { display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.25); color: #fb7185; font-size: 0.76rem; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; margin-top: 4px; }
    .btn-lock-session:hover { background: rgba(244, 63, 94, 0.18); border-color: #fb7185; }
    .nav-list { list-style: none; padding: 12px 10px; }
    .nav-category { font-size: 0.72rem; text-transform: uppercase; font-weight: 800; color: var(--text-muted); letter-spacing: 0.08em; padding: 14px 12px 6px; }
    .nav-item a { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 6px; color: var(--text-secondary); text-decoration: none; font-size: 0.82rem; font-weight: 500; transition: all 0.15s; }
    .nav-item a:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .nav-item.active a { background: rgba(56, 189, 248, 0.12); color: var(--accent-primary); font-weight: 600; }
    .method-tag { font-size: 0.65rem; font-family: 'JetBrains Mono', monospace; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
    .method-post { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .method-get { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .main-content { margin-left: 360px; flex: 1; padding: 40px 60px 100px; max-width: 1350px; }
    .hero-banner { background: linear-gradient(135deg, rgba(22, 32, 50, 0.9) 0%, rgba(10, 15, 29, 0.98) 100%); border: 1px solid var(--border-color); border-radius: 16px; padding: 36px; margin-bottom: 40px; position: relative; overflow: hidden; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5); }
    .hero-title { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-desc { font-size: 1.02rem; color: var(--text-secondary); max-width: 860px; margin-bottom: 24px; }
    .quick-stats-row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
    .stat-pill { background: rgba(10, 15, 29, 0.7); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
    .stat-pill strong { color: #fff; font-size: 1.15rem; }
    .stat-pill span { font-size: 0.82rem; color: var(--text-muted); }
    .program-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
    .program-card { background: rgba(10, 15, 29, 0.5); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; }
    .program-card-badge { display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px; }
    .badge-school { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-college { background: rgba(129, 140, 248, 0.15); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.3); }
    .badge-employee { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-campus { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .program-card h4 { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .program-card p { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; }
    .baseurl-card { background: var(--code-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px 22px; margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .baseurl-header { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; }
    .baseurl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .baseurl-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 8px; gap: 10px; }
    .baseurl-code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--accent-primary); }
    .btn-copy { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 5px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; user-select: none; }
    .btn-copy:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .module-section { margin-bottom: 50px; }
    .module-title { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; padding-bottom: 12px; border-bottom: 2px solid var(--border-color); margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .module-count { font-size: 0.8rem; font-weight: 600; background: rgba(56, 189, 248, 0.15); color: var(--accent-primary); padding: 3px 10px; border-radius: 9999px; }
    .endpoint-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; margin-bottom: 24px; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; }
    .endpoint-card:hover { border-color: #3b5070; box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.4); }
    .endpoint-header { padding: 18px 24px; background: rgba(10, 15, 29, 0.5); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
    .endpoint-main-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .endpoint-path { font-family: 'JetBrains Mono', monospace; font-size: 0.95rem; font-weight: 600; color: #fff; }
    .badge-service { font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); border: 1px solid var(--border-color); }
    .badge-auth { font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }
    .badge-jwt { background: rgba(129, 140, 248, 0.15); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.3); }
    .badge-public { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
    .endpoint-body { padding: 24px; }
    .endpoint-name { font-size: 1.18rem; font-weight: 700; margin-bottom: 6px; color: #fff; }
    .endpoint-desc { color: var(--text-secondary); font-size: 0.92rem; margin-bottom: 18px; }
    .dev-note-box { background: rgba(56, 189, 248, 0.08); border-left: 3px solid var(--accent-primary); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: 0.84rem; color: #bae6fd; margin-bottom: 20px; }
    .param-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 24px; }
    .param-table th { text-align: left; padding: 10px 14px; background: var(--code-bg); color: var(--text-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-color); }
    .param-table td { padding: 12px 14px; border-bottom: 1px solid rgba(36, 52, 77, 0.6); color: var(--text-secondary); }
    .param-name { font-family: 'JetBrains Mono', monospace; color: #fff; font-weight: 600; }
    .param-type { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--accent-primary); }
    .param-req { font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .param-req.req-yes { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
    .param-req.req-no { background: rgba(148, 163, 184, 0.15); color: #94a3b8; }
    .code-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 1024px) { .code-grid { grid-template-columns: 1fr; } }
    .code-box { background: var(--code-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .code-header { padding: 10px 14px; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .code-content { padding: 14px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #e2e8f0; overflow-x: auto; max-height: 320px; line-height: 1.5; }
    .curl-box { margin-top: 16px; background: var(--code-bg); border: 1px solid var(--border-color); border-radius: 8px; }
  </style>
</head>
<body>

  <!-- Auth Gatekeeper Screen -->
  <div id="authGatekeeper" class="auth-gatekeeper-overlay">
    <div class="auth-gatekeeper-card">
      <div class="auth-lock-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="auth-title">OriginBI API Portal</div>
      <div class="auth-badge">AES-256 Encrypted Access</div>
      <p class="auth-desc">This documentation is cryptographically encrypted. Enter your developer passphrase to decrypt and unlock the API specification.</p>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="auth-input-group">
          <input type="password" id="authPasscode" class="auth-input" placeholder="Enter Developer Passcode" autocomplete="current-password" autofocus required>
          <button type="button" class="btn-toggle-pass" onclick="togglePassVisibility()">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div id="authErrorMsg" class="auth-error-msg">Incorrect passcode. Decryption failed.</div>
        <button type="submit" id="btnUnlock" class="btn-unlock">
          <span>Decrypt & Unlock Portal</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </form>
      <div class="auth-footer-note">Confidential — OriginBI Mobile Application Engineering</div>
    </div>
  </div>

  <!-- Host element for decrypted portal content -->
  <div id="decryptedPortalHost"></div>

  <script>
    // =========================================================================

    // Helper: Hex string to Uint8Array
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    // Helper: Base64 to Uint8Array
    function base64ToBytes(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    // WebCrypto AES-GCM 256-bit Decryption
    async function decryptPayload(passphrase) {
      const enc = new TextEncoder();
      const salt = hexToBytes(ENCRYPTED_PACKAGE.salt);
      const iv = hexToBytes(ENCRYPTED_PACKAGE.iv);
      const ciphertextWithTag = base64ToBytes(ENCRYPTED_PACKAGE.ciphertext);

      // 1. Import passphrase key
      const pwKey = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      // 2. Derive AES-GCM 256 key using PBKDF2 (100,000 iterations)
      const derivedKey = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        pwKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      // 3. Decrypt ciphertext
      const decryptedBuffer = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        derivedKey,
        ciphertextWithTag
      );

      const dec = new TextDecoder();
      return JSON.parse(dec.decode(decryptedBuffer));
    }

      if (e) e.preventDefault();
      const input = document.getElementById("authPasscode");
      const errorMsg = document.getElementById("authErrorMsg");
      const btnUnlock = document.getElementById("btnUnlock");
      const overlay = document.getElementById("authGatekeeper");
      const val = input.value.trim();

      if (!val) return;

      btnUnlock.disabled = true;
      btnUnlock.innerText = "Decrypting...";

      try {
        const pkg = await decryptPayload(val);
        decryptedResources = pkg;

        // Render decrypted portal
        document.getElementById("decryptedPortalHost").innerHTML = pkg.html;

        // Save session
        sessionStorage.setItem(AUTH_SESSION_KEY, val);

        // Hide lock screen
        overlay.classList.add("unlocked");
        errorMsg.classList.remove("show");

        // Init search
        initSearchFilter();
      } catch (err) {
        console.error("Decryption failed", err);
        errorMsg.classList.add("show");
        input.focus();
      } finally {
        btnUnlock.disabled = false;
        btnUnlock.innerHTML = "<span>Decrypt & Unlock Portal</span>";
      }
    }

    // Check existing session
    async function checkExistingAuth() {
      const savedPass = sessionStorage.getItem(AUTH_SESSION_KEY);
      if (savedPass) {
        try {
          const pkg = await decryptPayload(savedPass);
          decryptedResources = pkg;
          document.getElementById("decryptedPortalHost").innerHTML = pkg.html;
          document.getElementById("authGatekeeper").classList.add("unlocked");
          initSearchFilter();
        } catch {
          sessionStorage.removeItem(AUTH_SESSION_KEY);
        }
      }
    }

    // Lock portal
    function lockPortal() {
      sessionStorage.removeItem(AUTH_SESSION_KEY);
      decryptedResources = null;
      document.getElementById("decryptedPortalHost").innerHTML = "";
      const overlay = document.getElementById("authGatekeeper");
      overlay.classList.remove("unlocked");
      const input = document.getElementById("authPasscode");
      if (input) {
        input.value = "";
        input.focus();
      }
    }

    // Toggle password visibility
    function togglePassVisibility() {
      const input = document.getElementById("authPasscode");
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    }

    // Trigger in-memory download from decrypted memory
    function downloadDecryptedFile(type) {
      if (!decryptedResources) return;
      let filename = "originbi_api.json";
      let content = "";
      let mimeType = "application/json";

      if (type === "postman") {
        filename = "originbi_postman_collection.json";
        content = decryptedResources.postman;
      } else if (type === "swagger") {
        filename = "swagger.json";
        content = decryptedResources.swagger;
      } else if (type === "markdown") {
        filename = "ORIGINBI_MOBILE_APP_API_DOCUMENTATION.md";
        content = decryptedResources.markdown;
        mimeType = "text/markdown";
      }

      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Copy code from sibling block
    function copyBoxCode(btn) {
      const box = btn.closest('.code-box') || btn.closest('.curl-box');
      const code = box ? box.querySelector('.code-content') : null;
      if (code) {
        navigator.clipboard.writeText(code.innerText.trim()).then(() => {
          showCopied(btn);
        });
      }
    }

    // Copy direct text
    function copyDirectText(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        showCopied(btn);
      });
    }

    // Visual feedback
    function showCopied(btn) {
      const originalText = btn.innerText;
      btn.innerText = "✓ Copied";
      btn.style.color = "#34d399";
      btn.style.borderColor = "#34d399";
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.color = "";
        btn.style.borderColor = "";
      }, 1500);
    }

    // Search filter across dynamically injected cards
    function initSearchFilter() {
      const searchInput = document.getElementById('searchInput');
      if (!searchInput) return;

      searchInput.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        const cards = document.querySelectorAll('.endpoint-card');
        const navItems = document.querySelectorAll('.nav-item');

        cards.forEach(card => {
          const text = card.textContent.toLowerCase();
          card.style.display = text.includes(q) ? 'block' : 'none';
        });

        navItems.forEach(item => {
          const text = item.textContent.toLowerCase();
          item.style.display = text.includes(q) ? 'block' : 'none';
        });
      });
    }

    // Initialize
    checkExistingAuth();
    document.addEventListener("DOMContentLoaded", checkExistingAuth);
  </script>
</body>
</html>
